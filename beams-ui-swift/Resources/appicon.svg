<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16295c"/>
      <stop offset="0.55" stop-color="#0a1330"/>
      <stop offset="1" stop-color="#05091a"/>
    </linearGradient>
    <radialGradient id="glowfloor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fe7ff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#3fb6e6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3fb6e6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ff0ff" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#9ff0ff" stop-opacity="0.22"/>
      <stop offset="0.85" stop-color="#ffd98a" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="padMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9dfe8"/>
      <stop offset="0.5" stop-color="#8e98a8"/>
      <stop offset="1" stop-color="#4e5665"/>
    </linearGradient>
    <linearGradient id="padTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3550"/>
      <stop offset="1" stop-color="#121a2e"/>
    </linearGradient>
    <filter id="blur18" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="186" ry="186"/></clipPath>
  </defs>

  <!-- icon body -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(512 512) scale(1.18) translate(-512 -512)">

    <!-- distant stars -->
    <g fill="#ffffff">
      <circle cx="190" cy="210" r="2.2" opacity="0.55"/><circle cx="270" cy="160" r="1.6" opacity="0.4"/>
      <circle cx="820" cy="190" r="2.4" opacity="0.6"/><circle cx="760" cy="300" r="1.5" opacity="0.4"/>
      <circle cx="150" cy="420" r="1.8" opacity="0.45"/><circle cx="870" cy="470" r="1.7" opacity="0.4"/>
      <circle cx="230" cy="620" r="1.6" opacity="0.35"/><circle cx="840" cy="640" r="2" opacity="0.4"/>
      <circle cx="640" cy="150" r="1.4" opacity="0.35"/><circle cx="360" cy="250" r="1.3" opacity="0.3"/>
    </g>

    <!-- floor glow under the pad -->
    <ellipse cx="512" cy="790" rx="360" ry="110" fill="url(#glowfloor)" filter="url(#blur18)"/>

    <!-- transporter pad: base ring -->
    <ellipse cx="512" cy="792" rx="268" ry="78" fill="#2b3446"/>
    <ellipse cx="512" cy="780" rx="268" ry="78" fill="url(#padMetal)"/>
    <ellipse cx="512" cy="780" rx="232" ry="64" fill="url(#padTop)"/>
    <!-- light ring -->
    <ellipse cx="512" cy="780" rx="210" ry="56" fill="none" stroke="#7fe7ff" stroke-width="10" opacity="0.9" filter="url(#blur2)"/>
    <ellipse cx="512" cy="780" rx="210" ry="56" fill="none" stroke="#dffaff" stroke-width="3"/>
    <!-- pad segments -->
    <g stroke="#0c1424" stroke-width="4" fill="none" opacity="0.8">
      <path d="M 302 780 L 722 780"/>
      <path d="M 391 733 L 633 827"/>
      <path d="M 633 733 L 391 827"/>
    </g>
    <ellipse cx="512" cy="780" rx="70" ry="19" fill="#0c1424" stroke="#7fe7ff" stroke-width="3" opacity="0.95"/>

    <!-- the beam column -->
    <rect x="360" y="170" width="304" height="620" fill="url(#beam)" filter="url(#blur18)"/>
    <rect x="410" y="200" width="204" height="590" fill="url(#beam)" filter="url(#blur6)"/>

    <!-- energising sparkles: gold -->
    <g fill="#ffd98a">
      <circle cx="450" cy="250" r="6" opacity="0.55"/><circle cx="560" cy="230" r="4" opacity="0.5"/>
      <circle cx="500" cy="300" r="9" opacity="0.8"/><circle cx="600" cy="330" r="5" opacity="0.6"/>
      <circle cx="430" cy="360" r="7" opacity="0.75"/><circle cx="530" cy="390" r="12" opacity="0.9"/>
      <circle cx="470" cy="440" r="5" opacity="0.6"/><circle cx="585" cy="450" r="8" opacity="0.8"/>
      <circle cx="510" cy="500" r="14" opacity="0.95"/><circle cx="440" cy="520" r="6" opacity="0.7"/>
      <circle cx="600" cy="560" r="10" opacity="0.85"/><circle cx="480" cy="590" r="8" opacity="0.8"/>
      <circle cx="545" cy="620" r="12" opacity="0.9"/><circle cx="420" cy="640" r="5" opacity="0.6"/>
      <circle cx="505" cy="680" r="9" opacity="0.85"/><circle cx="590" cy="690" r="6" opacity="0.7"/>
      <circle cx="460" cy="720" r="7" opacity="0.75"/><circle cx="540" cy="745" r="5" opacity="0.7"/>
    </g>
    <!-- sparkles: cyan -->
    <g fill="#9ff0ff">
      <circle cx="520" cy="210" r="3" opacity="0.5"/><circle cx="470" cy="280" r="4" opacity="0.6"/>
      <circle cx="575" cy="290" r="6" opacity="0.7"/><circle cx="495" cy="345" r="5" opacity="0.7"/>
      <circle cx="555" cy="420" r="9" opacity="0.85"/><circle cx="455" cy="470" r="8" opacity="0.8"/>
      <circle cx="615" cy="500" r="5" opacity="0.6"/><circle cx="530" cy="545" r="7" opacity="0.8"/>
      <circle cx="470" cy="560" r="11" opacity="0.9"/><circle cx="580" cy="610" r="6" opacity="0.7"/>
      <circle cx="435" cy="600" r="4" opacity="0.6"/><circle cx="515" cy="650" r="10" opacity="0.9"/>
      <circle cx="565" cy="665" r="4" opacity="0.6"/><circle cx="445" cy="690" r="9" opacity="0.85"/>
      <circle cx="500" cy="735" r="12" opacity="0.95"/><circle cx="605" cy="740" r="5" opacity="0.65"/>
    </g>
    <!-- soft halo around the brightest sparkles -->
    <g fill="#ffffff" filter="url(#blur6)" opacity="0.7">
      <circle cx="510" cy="500" r="18"/><circle cx="470" cy="560" r="14"/><circle cx="500" cy="735" r="16"/><circle cx="530" cy="390" r="14"/>
    </g>

    <!-- top shimmer where the beam originates -->
    <ellipse cx="512" cy="215" rx="90" ry="14" fill="#9ff0ff" opacity="0.35" filter="url(#blur6)"/>
  </g>
</svg>
